repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, pydantic-settings, playwright]
        args: [--strict, --no-error-summary]
        pass_filenames: false
        entry: mypy --strict laya_ultrafast

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.4.0
    hooks:
      - id: uv-lock
        args: [--frozen]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest tests/unit --cov=laya_ultrafast --cov-fail-under=85 -q
        language: system
        types: [python]
        pass_filenames: false
        always_run: true