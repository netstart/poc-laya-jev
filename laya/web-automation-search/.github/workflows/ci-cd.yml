name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'  # Weekly soak test on Mondays at 2am

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.0"
      
      - name: Install dependencies
        run: uv sync --dev
      
      - name: Ruff lint
        run: uv run ruff check .
      
      - name: Ruff format check
        run: uv run ruff format --check .
      
      - name: Bandit security scan
        run: uv run bandit -r laya_ultrafast -c bandit.yaml || true
      
      - name: pip-audit
        run: uv run pip-audit || true

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.0"
      
      - name: Install dependencies
        run: uv sync --dev
      
      - name: Mypy type check
        run: uv run mypy --strict laya_ultrafast

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.0"
      
      - name: Install dependencies
        run: uv sync --dev
      
      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium
      
      - name: Run unit tests with coverage
        run: |
          uv run pytest tests/unit \
            --cov=laya_ultrafast \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -v
      
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  test-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.0"
      
      - name: Install dependencies
        run: uv sync --dev
      
      - name: Run contract tests
        run: uv run pytest tests/integration/contract -v

  test-integration:
    runs-on: ubuntu-latest
    needs: [test-unit, test-contract]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.0"
      
      - name: Install dependencies
        run: uv sync --dev
      
      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium
      
      - name: Run integration tests (headless)
        run: uv run pytest tests/integration -v -m "not slow"
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: .pytest_cache/

  benchmark:
    runs-on: ubuntu-latest
    needs: [test-unit, test-contract]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.0"
      
      - name: Install dependencies
        run: uv sync --dev
      
      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium
      
      - name: Run benchmarks
        run: |
          uv run python scripts/benchmark.py --all --runs 3 --output benchmarks/results.json
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmarks/results.json

  soak-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.0"
      
      - name: Install dependencies
        run: uv sync --dev
      
      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium
      
      - name: Run soak test
        run: |
          uv run python scripts/benchmark.py --scenario search --runs 10 --output benchmarks/soak_results.json
      
      - name: Upload soak results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-results
          path: benchmarks/soak_results.json

  build:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test-unit, test-contract, test-integration]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.0"
      
      - name: Build package
        run: uv build
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/