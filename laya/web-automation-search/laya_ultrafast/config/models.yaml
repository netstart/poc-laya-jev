# LAYA Model Registry
# Define supported models with their recommended parameters
# NOTE: LAYA runs with embedded heuristic model by default.
# To use external LLM providers, configure LAYA_MODEL_PROVIDER in .env.

models:
  # --- Llama.cpp / GGUF ---
  - name: "llama-3.1-8b-instruct-q4_k_m.gguf"
    provider: "local"
    context_window: 8192
    max_output: 4096
    recommended_temperature: 0.1
    quantization: "q4_k_m"
    description: "Llama 3.1 8B GGUF for llama.cpp server (modo heurístico)"

  # --- OpenAI-compatible (vLLM, LocalAI, etc.) ---
  - name: "meta-llama/Meta-Llama-3.1-8B-Instruct"
    provider: "openai"
    context_window: 131072
    max_output: 8192
    recommended_temperature: 0.1
    quantization: "auto"
    description: "Llama 3.1 8B via vLLM/OpenAI-compatible endpoint"

  - name: "mistralai/Mistral-7B-Instruct-v0.3"
    provider: "openai"
    context_window: 32768
    max_output: 8192
    recommended_temperature: 0.1
    quantization: "auto"
    description: "Mistral 7B Instruct v0.3 via vLLM/OpenAI-compatible endpoint"

# Provider-specific defaults
defaults:
  local:
    base_url: "http://localhost:8080"
    timeout_ms: 60000
  openai:
    base_url: "http://localhost:8000/v1"
    timeout_ms: 60000

# Fallback chain (used when primary model fails)
fallback_chain:
  - "llama-3.1-8b-instruct-q4_k_m.gguf"