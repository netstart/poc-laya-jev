[project]
name = "laya-ultrafast"
version = "0.1.0"
description = "Local agent for web automation via vision-free DOM state (LAYA)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "LAYA Contributors", email = "laya@example.com" }
]
keywords = ["web-automation", "agent", "local-ai", "vision-free", "browser"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "playwright>=1.47.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "tiktoken>=0.7.0",
    "rich>=13.7.0",
    "loguru>=0.7.0",
    "tenacity>=9.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pyright>=1.1.300",
    "pre-commit>=3.7.0",
    "respx>=0.21.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]
# Dependências opcionais - removidas para modo totalmente local/heurístico
# ollama = [
#     "ollama>=0.3.0",
# ]
openai = [
    "openai>=1.43.0",
]
benchmark = [
    "psutil>=5.9.0",
    "memory-profiler>=0.61.0",
]

[project.scripts]
laya = "laya_ultrafast.agent:main"

[project.urls]
Homepage = "https://github.com/your-org/laya-ultrafast"
Repository = "https://github.com/your-org/laya-ultrafast"
Documentation = "https://github.com/your-org/laya-ultrafast#readme"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["laya_ultrafast"]

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["laya_ultrafast/**/*.py", "tests/**/*.py", "scripts/**/*.py", "examples/**/*.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "RUF", # ruff-specific rules
    "SIM", # simplify
    "TC",  # type-checking
]
ignore = ["B008"]  # function calls in default arguments

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101"]  # asserts in tests are fine
"scripts/**/*" = ["T201"]  # print statements in scripts

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
show_error_codes = true
show_error_context = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "laya_ultrafast"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pyright]
include = ["laya_ultrafast"]
executionEnvironments = [
    { root = "laya_ultrafast", pythonVersion = "3.11", typeCheckingMode = "strict" }
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=laya_ultrafast",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
markers = [
    "integration: marks tests as integration tests (requires browser)",
    "network: marks tests as requiring network access",
    "slow: marks tests as slow",
]

[tool.coverage.run]
source = ["laya_ultrafast"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.bandit]
extend-exclude = ["tests", "benchmarks"]

[tool.pre-commit-hooks]
# Will be configured in .pre-commit-config.yaml

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
# O Pydantic resolve as annotations em tempo de execução, então os imports
# usados em campos de BaseModel/BaseSettings não podem ir para TYPE_CHECKING.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]
runtime-evaluated-decorators = [
    "pydantic.field_validator",
    "pydantic.model_validator",
    "pydantic.validator",
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
